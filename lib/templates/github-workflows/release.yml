# Auto-installed by hive's gh-init.sh. Fires when a tag of the form vX.Y.Z
# is pushed (release-runner.sh does that after release-gates.sh passes).
# Re-builds the tarball deterministically on a clean runner and verifies it
# against the .sha256 sidecar that was COMMITTED WITH THE TAG (the original
# published checksum — not the sidecar the rebuild just generated, which
# would be a self-referential check that can never detect drift), then
# uploads the artifacts to the GitHub release page.
#
# RELEASE PRE-REQUISITE: after running packaging/build-package.sh locally,
# `git add dist/hive-X.Y.Z.sha256` and include the sidecar in the tag commit.
# Without it this workflow fails loudly rather than shipping an unverified
# rebuild.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify VERSION matches tag
        run: |
          tag="${GITHUB_REF##*/}"        # e.g. v0.3.0
          ver_in_file=""
          [ -f VERSION ] && ver_in_file=$(tr -d '[:space:]' < VERSION)
          if [ "v${ver_in_file}" != "$tag" ]; then
            echo "::error::tag $tag does not match VERSION '$ver_in_file' (expected v$ver_in_file)"
            exit 1
          fi

      - name: Require committed checksum sidecar
        run: |
          ver="${GITHUB_REF##*/v}"
          if [ ! -f "dist/hive-${ver}.sha256" ]; then
            echo "::error::dist/hive-${ver}.sha256 is not committed. Commit the .sha256 sidecar with the release tag so the rebuilt tarball can be verified against the published checksum."
            exit 1
          fi
          # Stash it: the rebuild below regenerates BOTH the tarball and the
          # sidecar, so verifying the freshly generated pair would be
          # self-referential and could never detect drift.
          cp "dist/hive-${ver}.sha256" "/tmp/hive-${ver}.sha256.committed"

      - name: Re-build deterministically
        run: |
          if [ ! -f packaging/build-package.sh ]; then
            echo "::error::packaging/build-package.sh missing — cannot rebuild for verification"
            exit 1
          fi
          bash packaging/build-package.sh

      - name: Verify rebuilt tarball against the committed checksum
        run: |
          ver="${GITHUB_REF##*/v}"
          if ! (cd dist && sha256sum -c "/tmp/hive-${ver}.sha256.committed"); then
            echo "::error::rebuilt tarball does not match the committed checksum — the build is not reproducible or the tag tree differs from what was built locally. Refusing to upload."
            exit 1
          fi

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF##*/}"
          ver="${tag#v}"
          if [ ! -f "dist/hive-${ver}.tar.gz" ]; then
            echo "::error::no tarball at dist/hive-${ver}.tar.gz — the rebuild step did not produce it"
            exit 1
          fi
          gh release upload "$tag" "dist/hive-${ver}.tar.gz" "dist/hive-${ver}.sha256" --clobber
