[pytest]
pythonpath = lib
# The xdist worker contract (tests/test_xdist_contract.py): --dist is the
# loadgroup strategy — per-test scheduling, EXCEPT classes marked
# xdist_group (the ordered end-to-end e2e classes whose class-scoped
# fixture carries ordered state) are pinned to ONE worker, in order.
# Plain --dist=load slices the pending queue in consecutive chunks of up
# to 8 tests, so a 14-test ordered class can be split across two workers
# and each worker's class-scoped fixture lands in its own temp dir — the
# final read-path test then sees the unmutated fixture (0.18 gate-2
# caught it; 0.17's CI was lucky). loadgroup + xdist_group makes the
# split impossible; unmarked tests keep per-test scheduling, so the
# suite's load profile is unchanged.
#
# The SECTION NAME is part of the contract: pytest reads the [pytest]
# section of a pytest.ini file. The [tool:pytest] spelling (setup.cfg's
# section) in a pytest.ini is SILENTLY ignored — addopts reads back as
# [] (verified on pytest 8.4 and 9.1), --dist falls back to per-test
# load, and the ordered classes flake again. The 0.18 pin (c54b8e8)
# was dead on arrival for exactly this reason: every green gate since
# was per-test luck. The static proof is
# TestXdistGroupContract::test_pytest_ini_uses_the_section_pytest_reads;
# the runtime proof is test_loadgroup_pin_is_live (a nested -n 4 run of
# a group-marked probe class that passes only if the pin is live).
# T4 (0.22): -p adaptive_xdist makes a BARE `pytest tests/` (no -n)
# run parallel with the capped adaptive worker count — the formula in
# lib/adaptive_xdist.py, min(32, max(4, cpu // 4)). An explicit -n
# always wins; CI's `-n auto` on the 2-core runners is untouched.
# It is a PLUGIN,
# not conftest logic: xdist 3.8 reads config.option.numprocesses in
# its own pytest_configure, which a conftest cannot precede (probed).
addopts = -p adaptive_xdist --dist=loadgroup
