name: Feature request
about: An idea for a new or improved Hive capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The workflow pain or gap, with an example if you can.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What you expect Hive to do, roughly. CLI shape, config, agent workflow, ...
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
