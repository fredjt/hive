# GitHub Actions CI pipeline for Hive.
# Runs on every push to main and on every pull request.
#
# Jobs:
#   1. **Python tests** — matrix split by risk (S4, 0.12): ONE version
#      (3.12) carries the full suite; every supported version (3.10,
#      3.13) carries its version-sensitive paths — the config-load /
#      tomli-fallback tests + an import smoke + a quick CLI smoke.
#      RULE: the version-sensitive surface is PINNED by
#      tests/test_integration.py::TestTomliSurfaceGuard — a new
#      `import tomli` / `tomllib` outside the pinned files fails the
#      guard until the subset below is updated with it.
#
# Per-push wall time (T1, 0.13 — the figure lives in the repo, not in
# prose). First matrix push, run 42520823326 (432c2b8): pipeline 3m5s;
# suite steps — 3.12 full 165.5s (1,311 tests), 3.10 subset 44.6s
# (147), 3.13 subset 42.3s (147); total suite time 252.4s. Old 2x full
# matrix, run 42421662322 (pre-matrix): pipeline ~4m; suite steps —
# 3.12 full 205.3s, 3.10 full 210.7s (1,292 tests each); total 415.9s.
# So per-push: the full row is 165.5s vs the slower old row's 210.7s
# (the new run also carried +19 tests), the subset rows add ~1m of
# PARALLEL wall, and the 3.13 row's coverage costs no full-suite time.
#   2. **Bash syntax check** — `bash -n` on every .sh file in lib/tools/ and lib/core/
#   3. **Python linting** — ruff check (warn-only for existing style issues)
#   4. **Node.js dashboard** — basic syntax validation of server.js
#   5. **Secret scan** — gitleaks over the full history; any finding fails
#      the pipeline (C.1: a secret can never land in history again)
#
# Usage: push to main or open a PR; the workflow runs automatically.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # 1. Python test suite
  # ──────────────────────────────────────────────
  tests:
    name: Tests (Python ${{ matrix.python }} — ${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.12'
            suite: full
          - python: '3.10'
            suite: version-sensitive
          - python: '3.13'
            suite: version-sensitive
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install Rust toolchain for building pydantic-core, cffi, etc.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.cargo/bin:$PATH"
          # Core runtime deps (needed for imports in hive_cli/hive_mcp)
          pip install mcp fastapi 'uvicorn[standard]' httpx tomli
          # Test deps (xdist: the suite is xdist-safe, -n auto parallelizes
          # across the runner's cores)
          pip install pytest anyio pytest-xdist
          # Verify installation
          python -c "import mcp; import fastapi; import httpx; print('All dependencies installed successfully')"

      - name: Run test suite
        run: |
          if [ "${{ matrix.suite }}" = "full" ]; then
            # 3.12 carries the full suite (S4)
            PYTHONPATH=lib pytest tests/ -n auto -v --tb=short
          else
            # Version-sensitive subset (S4): config-load through the
            # pinned tomli/tomllib parser chain (test_json_structures),
            # [llm] section loads (test_llm_providers), CLI smoke
            # (test_cli), plus an import smoke over the runtime surface.
            PYTHONPATH=lib python -c \
              "import hive_cli.main, hive_mcp.server, hive_config, core.llm_providers"
            # The four pinned parser chains are exercised here: hive_config
            # + llm_providers (test_llm_providers loads [llm] through the
            # canonical chain), commands/config.py (TestConfigSetUpsert),
            # commands/doctor.py (TestConfigIntegrity's doctor checks);
            # test_json_structures parses the config TOML (its own
            # tomllib/tomli fallback) and test_cli is the CLI smoke.
            PYTHONPATH=lib pytest \
              tests/test_json_structures.py \
              tests/test_llm_providers.py \
              tests/test_cli.py \
              tests/test_commands.py::TestConfigSetUpsert \
              tests/test_commands.py::TestConfigIntegrity \
              -v --tb=short
          fi

  # ──────────────────────────────────────────────
  # 2. Bash syntax validation
  # ──────────────────────────────────────────────
  bash-check:
    name: Bash Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check all bash scripts for syntax errors
        run: |
          failed=0
          for script in $(find lib/tools lib/core -name '*.sh' | sort); do
            if ! bash -n "$script" 2>&1; then
              echo "FAIL: $script has syntax errors"
              failed=1
            fi
          done
          # Also check the main entry point and other top-level scripts
          for script in bin/hive entrypoint.sh packaging/*.sh; do
            [ -f "$script" ] || continue
            if ! bash -n "$script" 2>&1; then
              echo "FAIL: $script has syntax errors"
              failed=1
            fi
          done
          if [ $failed -ne 0 ]; then
            exit 1
          fi

      - name: Check shell scripts use proper shebangs
        run: |
          issues=0
          for script in $(find lib/tools lib/core -name '*.sh' | sort); do
            first_line=$(head -n1 "$script")
            if [[ ! "$first_line" =~ ^#!.*bash ]]; then
              echo "WARN: $script missing bash shebang (got: $first_line)"
              issues=1
            fi
          done
          for script in bin/hive entrypoint.sh; do
            [ -f "$script" ] || continue
            first_line=$(head -n1 "$script")
            if [[ ! "$first_line" =~ ^#!.*bash ]]; then
              echo "WARN: $script missing bash shebang (got: $first_line)"
              issues=1
            fi
          done
          [ $issues -eq 0 ] || exit 1

  # ──────────────────────────────────────────────
  # 3. Node.js dashboard syntax check
  # ──────────────────────────────────────────────
  node-check:
    name: Node.js Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 24: Node 20 is EOL — runners force-run old pin values on
          # Node 24 and annotate the run with a deprecation warning.
          node-version: '24'

      - name: Check dashboard server.js syntax
        run: |
          # Validate the dashboard server has no syntax errors
          node --check lib/dashboard/server.js

  # ──────────────────────────────────────────────
  # 4. Python linting (ruff)
  # ──────────────────────────────────────────────
  lint:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check (real issues only)
        run: |
          # Only flag actual bugs, not style nitpicks (line length,
          # single-line ifs, etc.) that the codebase already has.
          # C.3: the full Python surface — lib/ (all Python, including
          # the harness core) plus tests/ — under the same selection.
          ruff check --select F401,E722 lib/ tests/
          # F401 = unused import (real bug)
          # E722 = do not use bare 'except' (security risk)

  # ──────────────────────────────────────────────
  # 5. Secret scan (gitleaks)
  # ──────────────────────────────────────────────
  secrets:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history — the guard's job is to catch secrets in ANY
          # past commit, not just the working tree.
          fetch-depth: 0

      - name: Install gitleaks (single static binary)
        run: |
          # Pinned release, static binary: no runner dependency issues.
          GITLEAKS_VERSION=8.30.1
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks over full history
        run: gitleaks detect --source . --redact --no-banner
        # detect exits non-zero on any finding → the job (and the
        # pipeline) fails. --redact keeps findings out of the logs.
        # Complements tests/test_history_scrub.py: gitleaks applies
        # generic signature patterns; the scrub test pins this repo's
        # exact private paths + owner identity strings.
