# GitHub Actions CI pipeline for Hive.
# Runs on every push to main and on every pull request.
#
# Jobs:
#   1. **Python tests** — EXACTLY TWO FULL ROWS (T4, 0.15): 3.12 and
#      3.13, both running the full suite. The S4 (0.12) risk split —
#      one full row + version-sensitive subsets — retires with the 3.10
#      row: Python 3.10 is EOL (2026-10-04) and 3.11 is the floor
#      (packaging/pyproject.toml), so the version-sensitive surface
#      that existed only for 3.10 (the tomli backport) is gone; there
#      is no subset left to run. Wall impact (the figures live in the
#      repo, not in prose): before — 3.12 full 165.5s (1,311 tests),
#      3.10 subset 44.6s (147), 3.13 subset 42.3s (147) (run
#      42520823326); after — 3.12 full ~165s + 3.13 full ~205s (the
#      3.13 full figure is the 0.14 one-off confidence run), each
#      row parallel on its runner. RULE: the floor story is pinned by
#      tests/test_json_structures.py::TestPythonFloorConsistency (the
#      docs agree with pyproject) and
#      tests/test_integration.py::TestNoTomliInLib (`import tomli` is
#      absent from lib/ — re-opening the 3.10 surface fails).
#   2. **Bash syntax check** — `bash -n` on every .sh file in lib/tools/ and lib/core/
#   3. **Python linting** — ruff check (warn-only for existing style issues)
#   4. **Node.js dashboard** — basic syntax validation of server.js
#   5. **Secret scan** — gitleaks over the full history; any finding fails
#      the pipeline (C.1: a secret can never land in history again)
#
# Usage: push to main or open a PR; the workflow runs automatically.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # 1. Python test suite
  # ──────────────────────────────────────────────
  tests:
    name: Tests (Python ${{ matrix.python }} — ${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.12'
            suite: full
          - python: '3.13'
            suite: full
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: pip wheel cache (shared by the two push rows)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          # T3 (0.16): keyed on sha256 of the lock (hashFiles) +
          # interpreter + OS. Shared by BOTH push rows — the install
          # step (24s/12s, run 42934413101) drops to a cache hit: the
          # bytes are identical by key, so a hit is a safe reuse on
          # the "installs and goes green TODAY" rows. The scheduled
          # row (scheduled.yml) is the explicit exception: NO cache —
          # its job is the weeks-later PyPI re-resolution (a hit would
          # turn "does PyPI still serve it" into "does our cache still
          # hold it").
          key: hive-wheels-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('packaging/requirements.lock.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Core runtime deps: the LOCK (the released Python environment,
          # T1 0.14) — the push rows verify the lock installs and goes
          # green TODAY; the scheduled row (scheduled.yml) re-checks the
          # same lock weeks later (reproducibility over time, T4 0.15).
          # T3 (0.16): --only-binary :all: — the wheel-only contract in
          # EVERY push: a lock line that loses wheel coverage fails the
          # row, naming the line (the fix is a pin with wheels, or a
          # documented exception in share/docs/PACKAGING.md). The inert
          # toolchain step is gone: a --default-toolchain none install
          # ships NO compiler (it enabled no build), and the lock's
          # closure needs none — it resolves 100% as wheels
          # (TestLockWheelOnly; TestCIWheelOnlyContract pins both).
          pip install --only-binary :all: -r packaging/requirements.lock.txt
          # Test deps (xdist: the suite is xdist-safe, -n auto parallelizes
          # across the runner's cores). pytest is capped below 9.2:
          # 9.2.0 broke xdist's loadgroup distribution (upstream
          # pytest-dev/pytest#15303 — tests marked xdist_group scatter
          # across workers, silently; the xdist fix, pytest-dev/pytest-
          # xdist#1402, is unmerged/untagged). The ordered e2e classes
          # would flake on exactly that (the 0.19 CI row 43166999826
          # drew it: TestTicketHumanFace + the pin probe failed). Revisit
          # the cap when a fixed xdist release ships.
          pip install "pytest<9.2" anyio pytest-xdist
          # Verify installation
          python -c "import mcp; import fastapi; import httpx; print('All dependencies installed successfully')"

      - name: Run test suite
        run: |
          # T4 (0.15): both rows run the full suite — the S4
          # version-sensitive subset retired with the 3.10 row.
          PYTHONPATH=lib pytest tests/ -n auto -v --tb=short

  # ──────────────────────────────────────────────
  # 2. Bash syntax validation
  # ──────────────────────────────────────────────
  bash-check:
    name: Bash Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check all bash scripts for syntax errors
        run: |
          failed=0
          for script in $(find lib/tools lib/core -name '*.sh' | sort); do
            if ! bash -n "$script" 2>&1; then
              echo "FAIL: $script has syntax errors"
              failed=1
            fi
          done
          # Also check the main entry point and other top-level scripts
          for script in bin/hive entrypoint.sh packaging/*.sh; do
            [ -f "$script" ] || continue
            if ! bash -n "$script" 2>&1; then
              echo "FAIL: $script has syntax errors"
              failed=1
            fi
          done
          if [ $failed -ne 0 ]; then
            exit 1
          fi

      - name: Check shell scripts use proper shebangs
        run: |
          issues=0
          for script in $(find lib/tools lib/core -name '*.sh' | sort); do
            first_line=$(head -n1 "$script")
            if [[ ! "$first_line" =~ ^#!.*bash ]]; then
              echo "WARN: $script missing bash shebang (got: $first_line)"
              issues=1
            fi
          done
          for script in bin/hive entrypoint.sh; do
            [ -f "$script" ] || continue
            first_line=$(head -n1 "$script")
            if [[ ! "$first_line" =~ ^#!.*bash ]]; then
              echo "WARN: $script missing bash shebang (got: $first_line)"
              issues=1
            fi
          done
          [ $issues -eq 0 ] || exit 1

  # ──────────────────────────────────────────────
  # 3. Node.js dashboard syntax check
  # ──────────────────────────────────────────────
  node-check:
    name: Node.js Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 24: Node 20 is EOL — runners force-run old pin values on
          # Node 24 and annotate the run with a deprecation warning.
          node-version: '24'

      - name: Check dashboard server.js syntax
        run: |
          # Validate the dashboard server has no syntax errors
          node --check lib/dashboard/server.js

  # ──────────────────────────────────────────────
  # 4. Python linting (ruff)
  # ──────────────────────────────────────────────
  lint:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check (real issues only)
        run: |
          # Only flag actual bugs, not style nitpicks (line length,
          # single-line ifs, etc.) that the codebase already has.
          # C.3: the full Python surface — lib/ (all Python, including
          # the harness core) plus tests/ — under the same selection.
          ruff check --select F401,E722 lib/ tests/
          # F401 = unused import (real bug)
          # E722 = do not use bare 'except' (security risk)

  # ──────────────────────────────────────────────
  # 5. Secret scan (gitleaks)
  # ──────────────────────────────────────────────
  secrets:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history — the guard's job is to catch secrets in ANY
          # past commit, not just the working tree.
          fetch-depth: 0

      - name: Install gitleaks (single static binary)
        run: |
          # Pinned release, static binary: no runner dependency issues.
          GITLEAKS_VERSION=8.30.1
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks over full history
        run: gitleaks detect --source . --redact --no-banner
        # detect exits non-zero on any finding → the job (and the
        # pipeline) fails. --redact keeps findings out of the logs.
        # Complements tests/test_history_scrub.py: gitleaks applies
        # generic signature patterns; the scrub test pins this repo's
        # exact private paths + owner identity strings.
