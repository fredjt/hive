# Scheduled 3.13 full-suite row (T2, 0.14).
#
# The push matrix in ci.yml is UNTOUCHED (S4, 0.12: full on 3.12,
# version-sensitive subsets on 3.10/3.13) — this file is the ONLY CI
# addition in 0.14, and it lives in its own workflow on purpose: the
# Tomli surface guard (tests/test_integration.py::TestTomliSurfaceGuard)
# keeps checking ci.yml, not this file, and the push rows keep their
# push design.
#
# What it runs: the FULL suite on Python 3.13. 0.13 recorded ONE
# full-suite run on 3.13 by hand (1,334 passed / 6 skipped, 176.99s) —
# a datum, not a row. The datum decays: the suite has grown since, and
# every push since exercised only the 147-test subset on 3.13, so the
# full 3.13 coverage would never run again until someone remembered.
# A confidence datum that is taken once is an assumption, not a check;
# this makes it recurring.
#
# Triggers:
#   - schedule: weekly cron (Mondays 04:23 UTC — staggered, not on the
#     top of the hour)
#   - workflow_dispatch: manual —
#       gh workflow run scheduled.yml
#
# The first dispatch run's result (pass count + skip list + wall time,
# run id) is recorded in share/docs/PACKAGING.md (R3: the figure lives
# in the tree).
name: Scheduled 3.13 full

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

jobs:
  full-313:
    name: Tests (Python 3.13 — full, scheduled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install Rust toolchain for building pydantic-core, cffi, etc.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.cargo/bin:$PATH"
          # Core runtime deps (needed for imports in hive_cli/hive_mcp)
          pip install mcp fastapi 'uvicorn[standard]' httpx tomli
          # Test deps (xdist: the suite is xdist-safe, -n auto parallelizes
          # across the runner's cores)
          pip install pytest anyio pytest-xdist
          # Verify installation
          python -c "import mcp; import fastapi; import httpx; print('All dependencies installed successfully')"

      - name: Run the FULL test suite on 3.13
        run: |
          PYTHONPATH=lib pytest tests/ -n auto -v --tb=short
