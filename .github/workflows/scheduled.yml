# Reproducibility-over-time row (T4, 0.15).
#
# The split (documented in share/docs/PACKAGING.md): the push rows in
# ci.yml answer "does the lock install and go green TODAY" — a fresh
# checkout, the venv LOCK (packaging/requirements.lock.txt, the
# released Python environment, T1 0.14), today's PyPI. THIS row
# answers "does it still hold NEXT MONTH": a fresh runner weeks later
# re-resolves the SAME lock and re-runs the full suite against it — a
# broken pin, a yanked release, or a package that stopped building for
# a supported interpreter surfaces here, on a schedule, before it
# reaches an operator's machine.
#
# 0.14's scheduled row (the recurring 3.13 full, T2 0.14) retires with
# the S4 split: 3.13 is now a full PUSH row (T4, this release), so the
# recurring full-3.13 datum is already taken by every push; what the
# schedule uniquely adds is the WEEKS-LATER re-resolution.
#
# Triggers:
#   - schedule: weekly cron (Mondays 04:23 UTC — staggered, not on the
#     top of the hour)
#   - workflow_dispatch: manual —
#       gh workflow run scheduled.yml
#
# The first dispatch run's result (pass count + skip list + wall time,
# run id) is recorded in share/docs/PACKAGING.md (R3: the figure lives
# in the tree).
name: Reproducibility over time (scheduled)

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

jobs:
  reproducibility:
    name: Lock re-resolve + full suite (Python 3.13, scheduled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Re-resolve the venv lock (the released Python environment)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install Rust toolchain for building pydantic-core, cffi, etc.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.cargo/bin:$PATH"
          # The LOCK, not the floors: this row verifies the released
          # environment (what install.sh installs) still resolves from
          # PyPI weeks after the cut.
          pip install -r packaging/requirements.lock.txt
          # Test deps (xdist: the suite is xdist-safe, -n auto parallelizes
          # across the runner's cores)
          pip install pytest anyio pytest-xdist
          # Verify installation
          python -c "import mcp; import fastapi; import httpx; import tomllib; print('lock environment installed')"

      - name: Run the FULL test suite against the lock
        run: |
          PYTHONPATH=lib pytest tests/ -n auto -v --tb=short
