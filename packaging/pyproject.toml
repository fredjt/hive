[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hive-os"
version = "0.5.17"
description = "Hive — orchestrate a virtual company of Claude agents on a project"
readme = "../share/docs/README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "tomli>=2.0; python_version<'3.11'",
]

[project.scripts]
hive = "hive_cli.main:main"

[tool.setuptools]
package-dir = { "" = "../lib" }
packages = [
  "hive_cli",
  "hive_cli.commands",
  "hive_mcp",
  "hive_mcp.tools",
]
